<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2ef"/><stop offset="1" stop-color="#dedfda"/></linearGradient>
 <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#1d1f21"/><stop offset=".18" stop-color="#3a3d40"/><stop offset=".32" stop-color="#6d7276"/><stop offset=".42" stop-color="#3a3d40"/><stop offset=".85" stop-color="#1d1f21"/><stop offset="1" stop-color="#1d1f21"/></linearGradient>
 <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#7d8285"/><stop offset=".2" stop-color="#e9ecee"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".5" stop-color="#b9bec1"/><stop offset=".8" stop-color="#8b9093"/><stop offset="1" stop-color="#6c7174"/></linearGradient>
 <linearGradient id="lid" x1="0" x2="1"><stop offset="0" stop-color="#1b1d1e"/><stop offset=".3" stop-color="#4a4e51"/><stop offset=".45" stop-color="#2b2e30"/><stop offset="1" stop-color="#121314"/></linearGradient>
 <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<ellipse cx="400" cy="688" rx="190" ry="26" fill="url(#shadow)"/>
